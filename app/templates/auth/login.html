{% extends "base.html" %}

{% block title %}Masuk — EduParent{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-12rem)] flex flex-col justify-center py-6 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-brand-600 to-teal-400 shadow-lg shadow-brand-500/25 mb-4">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" class="w-12 h-12">
    </div>
    <h2 class="font-heading text-3xl font-extrabold tracking-tight text-slate-900">
      Masuk ke <span class="text-brand-600">EduParent</span>
    </h2>
    <p class="mt-2 text-sm text-slate-600">
      Portal Terpadu Tumbuh Kembang & Keamanan Penjemputan Anak PAUD/TK
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="glass-panel p-8 sm:rounded-3xl border border-white/80 shadow-xl shadow-slate-200/60 relative overflow-hidden">
      <!-- Decorative Pastel Glow -->
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-300/30 rounded-full blur-2xl pointer-events-none"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-warm-300/30 rounded-full blur-2xl pointer-events-none"></div>

      <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5 relative z-10">
        <div>
          <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Nama Pengguna (Username)
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" name="username" id="username" required
              class="block w-full pl-10 pr-3 py-2.5 sm:text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 bg-white/90 placeholder-slate-400 transition"
              placeholder="contoh: guru_rina">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
            Kata Sandi
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" name="password" id="password" required
              class="block w-full pl-10 pr-3 py-2.5 sm:text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 bg-white/90 placeholder-slate-400 transition"
              placeholder="••••••••">
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="remember" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300">
            <span class="text-xs text-slate-600">Ingat sesi saya</span>
          </label>
          <span class="text-xs text-brand-600 font-medium hover:underline cursor-pointer">Bantuan akses?</span>
        </div>

        <div>
          <button type="submit"
            class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all transform hover:-translate-y-0.5">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            Masuk Sekarang
          </button>
        </div>
      </form>

      <!-- Quick Demo Login Switcher -->
      <div class="mt-8 pt-6 border-t border-slate-100">
        <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center mb-3">
          ⚡ Akses Instan Akun Pengujian (Demo)
        </p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <button type="button" onclick="fillCredentials('admin', 'admin123')"
            class="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200/60 transition">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Admin
          </button>
          <button type="button" onclick="fillCredentials('guru_rina', 'guru123')"
            class="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg bg-teal-50 text-teal-700 hover:bg-teal-100 border border-teal-200/60 transition">
            <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i> Guru TK-A
          </button>
          <button type="button" onclick="fillCredentials('ortu_dewi', 'ortu123')"
            class="flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200/60 transition">
            <i data-lucide="heart" class="w-3.5 h-3.5"></i> Orang Tua
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function fillCredentials(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
  }
</script>
{% endblock %}
